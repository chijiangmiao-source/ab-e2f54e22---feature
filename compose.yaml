services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: calibration-flow:latest
    container_name: calibration-flow-web
    ports:
      # 宿主机端口可通过环境变量 HOST_PORT 配置（默认 8080）
      - "${HOST_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      AUDIT_DB: /data/audit.json
    volumes:
      - audit-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  verify:
    build:
      context: .
      dockerfile: Dockerfile
      target: verify
    image: calibration-flow:verify
    container_name: calibration-flow-verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_URL: http://web:8080
    restart: "no"

volumes:
  audit-data:
